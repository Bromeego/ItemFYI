name: Publish ItemFYI v0.2.34 tag (one time)

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    if: github.repository == 'Bromeego/ItemFYI'
    runs-on: ubuntu-latest
    steps:
      - name: Check out history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish release tag at the versioned commit
        shell: bash
        run: |
          set -euo pipefail
          target=030425e2b89f258fe1e97d1fe75f3312dddd8aa3
          version=$(git show "$target:ItemFYI.toc" | sed -n 's/^## Version: //p')
          test "$version" = "0.2.34"
          if git ls-remote --exit-code --tags origin refs/tags/v0.2.34; then
            echo "Refusing to overwrite an existing v0.2.34 tag."
            exit 1
          fi
          git tag v0.2.34 "$target"
          git push origin refs/tags/v0.2.34
