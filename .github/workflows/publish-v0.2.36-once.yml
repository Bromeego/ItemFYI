name: Publish ItemFYI v0.2.36 tag (one time)

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    if: github.repository == 'Bromeego/ItemFYI'
    runs-on: ubuntu-latest
    steps:
      - name: Check out history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish tag for validated v0.2.36 release commit
        shell: bash
        run: |
          set -euo pipefail
          target=be9f9eae04e23d9487062194433af251d687853b
          toc=$(git show "$target:ItemFYI.toc")
          test "$(printf '%s\n' "$toc" | sed -n 's/^## Version: //p')" = "0.2.36"
          test "$(printf '%s\n' "$toc" | sed -n 's/^## Interface: //p')" = "120105"
          if git ls-remote --exit-code --tags origin refs/tags/v0.2.36; then
            echo "Refusing to overwrite existing v0.2.36"
            exit 1
          fi
          git tag v0.2.36 "$target"
          git push origin refs/tags/v0.2.36
